name: refresh profile signals

on:
  schedule:
    # The website refreshes its public HTB snapshot daily at 06:00 UTC.
    - cron: "15 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: refresh-profile-signals
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test generator
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tests -v

      - name: Refresh console and latest signals
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/update_profile.py

      - name: Commit changed signals
        run: |
          set -euo pipefail
          git add -- README.md assets/signal-console-dark.svg assets/signal-console-light.svg
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "profile signals already current"
            exit 0
          fi
          git config user.name "profile-signal-bot"
          git config user.email "profile-signal-bot@users.noreply.github.com"
          git commit -m "chore: refresh profile signals"
          git push
